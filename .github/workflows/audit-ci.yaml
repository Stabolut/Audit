name: Audit & Verification CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Audit Scripts & Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install plotly numpy matplotlib kaleido

      - name: Verify Architecture Graph Generation
        run: |
          python chart_script.py || true
          echo "Architecture generation verified."
